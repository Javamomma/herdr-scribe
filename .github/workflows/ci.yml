name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The capture-composition tests assert ffmpeg-dependent behavior;
      # GitHub's macOS runners don't ship ffmpeg (ubuntu's do).
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python3 -m pytest tests/ -q
