# herdr-scribe — plugin manifest (STARTER; the build fills in real command paths)
id = "scribe"
name = "Scribe"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Live, no-recording meeting transcription: mic (+ optional call loopback) → live transcript + analyst panes; on stop, a plain meeting note. No audio file ever."
platforms = ["linux"]   # WSL2 counts as linux; Windows host used only for optional loopback

# --- Actions ---------------------------------------------------------------
[[actions]]
id = "start"
title = "Scribe: start meeting"
contexts = ["workspace"]
command = ["bash", "scribe.sh", "start"]

[[actions]]
id = "stop"
title = "Scribe: stop + write note"
contexts = ["workspace"]
command = ["bash", "scribe.sh", "stop"]

[[actions]]
id = "status"
title = "Scribe: status"
contexts = ["workspace"]
command = ["bash", "scribe.sh", "status"]

[[actions]]
id = "abort"
title = "Scribe: abort (discard, no note)"
contexts = ["workspace"]
command = ["bash", "scribe.sh", "abort"]

# NOTE: pane definitions (transcript pane, analyst pane) and start-option flags
# (--consent, --topic, --attendees, --teams, --no-analyst, --analyst-interval,
# --model) are specified in docs/EXTRACTION-BRIEF.md and wired during the build.
