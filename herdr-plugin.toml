# herdr-scribe — plugin manifest (validated against herdr 0.7.3).
#
# Schema notes (from real 0.7.x behavior):
#   - [[panes]] entries are ENTRYPOINTS: id/title/placement/command. They are
#     opened imperatively (`herdr plugin pane open --plugin scribe
#     --entrypoint <id>`) by the action wrappers in herdr/ — there is no
#     declarative open-on/close-on in 0.7.
#   - Actions cannot prompt for flag values in 0.7, so the start wrapper
#     reads its defaults from the environment / scribe.conf:
#       SCRIBE_DEFAULT_CONSENT   (required: one-party | all-party — start
#                                 refuses to run without an explicit consent)
#       SCRIBE_DEFAULT_TOPIC, SCRIBE_DEFAULT_SCOPE, SCRIBE_DEFAULT_ATTENDEES,
#       SCRIBE_NO_ANALYST=1, SCRIBE_TEAMS=1   (all optional)
#     The full-flag CLI (`scribe.sh start --consent ... --topic ...`) remains
#     available in any terminal.
#   - herdr 0.7 does not bind keys from a plugin manifest; bind in your
#     ~/.config/herdr/config.toml and `herdr server reload-config`.
id = "scribe"
name = "Scribe"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Live, no-recording meeting transcription: mic (+ optional call loopback) → live transcript + analyst panes; on stop, a plain meeting note, an optional policy gate, and reviewable auto-drafted artifacts. No audio file ever."
platforms = ["linux", "macos"]

# --- Actions ---------------------------------------------------------------

[[actions]]
id = "start"
title = "Scribe: start meeting"
contexts = ["workspace"]
command = ["bash", "herdr/start.sh"]

[[actions]]
id = "stop"
title = "Scribe: stop + note (+ artifact review)"
contexts = ["workspace"]
command = ["bash", "herdr/stop.sh"]

[[actions]]
id = "abort"
title = "Scribe: abort (discard, no note)"
contexts = ["workspace"]
command = ["bash", "herdr/abort.sh"]

[[actions]]
id = "status"
title = "Scribe: status + doctor"
contexts = ["workspace"]
command = ["bash", "herdr/status.sh"]

[[actions]]
id = "artifacts"
title = "Scribe: review artifacts"
contexts = ["workspace"]
command = ["bash", "herdr/artifacts.sh"]

# --- Pane entrypoints ------------------------------------------------------
# Opened/closed by the herdr/ wrappers; each resolves the running meeting's
# files at open time via scribe.sh's own resolver flags.

[[panes]]
id = "transcript"
title = "Scribe: transcript"
placement = "split"
command = ["bash", "-c", "exec tail -n +1 -f \"$(bash \"$HERDR_PLUGIN_ROOT/scribe.sh\" --current-transcript)\""]

[[panes]]
id = "analyst"
title = "Scribe: analyst brief"
placement = "split"
command = ["bash", "-c", "T=\"$(bash \"$HERDR_PLUGIN_ROOT/scribe.sh\" --current-transcript)\" && A=\"$(bash \"$HERDR_PLUGIN_ROOT/scribe.sh\" --current-analyst)\" && bash \"$HERDR_PLUGIN_ROOT/scribe-analyst.sh\" \"$T\" \"$A\" --interval \"${SCRIBE_ANALYST_INTERVAL:-60}\" & exec tail -n +1 -F \"$A\" 2>/dev/null"]

[[panes]]
id = "artifacts"
title = "Scribe: artifact review"
placement = "split"
command = ["bash", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/scribe-artifacts\" pane"]

# --- Optional host bridges (gated, degrade gracefully) ----------------------
# Neither bridge is required. Run `scribe.sh --doctor` any time to see which
# of them are currently available; missing bridges never break a meeting —
# scribe just runs mic-only / transcript-only-context.
#
#   scribe-loopback-setup.sh   builds the Windows remote-participant loopback
#                              exe (userland WASAPI via NAudio, in-box
#                              csc.exe). Wire the result in via
#                              SCRIBE_LOOPBACK_EXE.
#   scribe-screen-setup.sh     wires up optional screen-OCR context for the
#                              analyst (needs a screenshot tool + tesseract).
#                              Wire the result in via SCRIBE_SCREEN_OCR_CMD.
